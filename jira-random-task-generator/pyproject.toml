[project]
name = "jira-random-task-generator"
version = "1.0.0"
description = "AI-alapú (Vertex AI / Gemini) random Jira task generátor: epic/story bontás, prioritás, függőségek, sprint-kezelés"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "google-genai>=0.5.0",
    "pydantic>=2.7.0",
]

[project.scripts]
generate-jira-tasks = "generate_tasks:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["generate_tasks.py", "jira_lib"]
