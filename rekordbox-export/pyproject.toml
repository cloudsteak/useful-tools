[project]
name = "rekordbox-export"
version = "1.0.0"
description = "Rekordbox collection export CSV-be duplikáció-ellenőrzéssel"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rekordbox-export = "rekordbox_export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["rekordbox_export.py", "lib"]
